name: IPA iOS
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compilar sin firma
        run: flutter build ios --release --no-codesign
      - name: Empaquetar IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry Pulso-Basket-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: pulso-basket-ipa-unsigned
          path: Pulso-Basket-unsigned.ipa
